! Router0 running configuration, extracted from ec145_ec151_final_version.pkt (Cisco Packet Tracer 9.0.1)
!
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname COLLEGE-ROUTER
!
!
!
!
ip dhcp excluded-address 192.168.10.1 192.168.10.99
ip dhcp excluded-address 192.168.20.1 192.168.20.99
ip dhcp excluded-address 192.168.30.1 192.168.30.99
!
ip dhcp pool STUDENT_POOL
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.30.100
ip dhcp pool ADMIN_POOL
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.30.100
ip dhcp pool SERVER_POOL
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.30.100
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2911/K9 sn FTX1524TAA7-
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 description STUDENT_NETWORK
 ip address 192.168.10.1 255.255.255.0
 ip access-group STUDENT_SECURITY in
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description ADMIN_NETWORK
 ip address 192.168.20.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description SERVER_NETWORK
 ip address 192.168.30.1 255.255.255.0
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
!
ip flow-export version 9
!
!
ip access-list extended STUDENT_SECURITY
 permit udp any eq bootpc any eq bootps
 permit icmp 192.168.10.0 0.0.0.255 host 192.168.20.10
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.10.0 established
 deny ip 192.168.10.0 0.0.0.255 host 192.168.20.10
 permit ip 192.168.10.0 0.0.0.255 any
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
